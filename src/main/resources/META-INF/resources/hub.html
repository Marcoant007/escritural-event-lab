<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Hub Debug</title>
    <style>
        body { font-family: monospace; background: #1e1e1e; color: #ddd; margin: 0; padding: 20px; }
        h1 { font-size: 18px; font-weight: normal; }
        .panel { display: flex; gap: 20px; }
        .form { flex: 0 0 280px; }
        .log { flex: 1; background: #111; border: 1px solid #333; padding: 10px; height: 500px; overflow-y: auto; }
        label { display: block; margin-top: 10px; font-size: 12px; opacity: 0.7; }
        input, select, button { width: 100%; margin-top: 4px; padding: 6px; box-sizing: border-box; background: #2a2a2a; color: #ddd; border: 1px solid #444; }
        button { margin-top: 14px; cursor: pointer; background: #2f5f8f; border: none; }
        button:hover { background: #3a75ad; }
        .event { padding: 4px 0; border-bottom: 1px solid #222; font-size: 13px; }
        .KAFKA { color: #6fb3ff; }
        .IBM_MQ { color: #ffb86f; }
        .ts { opacity: 0.5; }
    </style>
</head>
<body>
    <h1>Hub de Integração — Debug</h1>
    <div class="panel">
        <div class="form">
            <label>Publicar em</label>
            <select id="target">
                <option value="KAFKA">Kafka hub.in → sai em Kafka hub.out</option>
                <option value="HUB_IBM_MQ">IBM MQ DEV.QUEUE.1 → sai em Kafka hub.out</option>
                <option value="BANCO_A_KAFKA">Kafka duplicata-recebida → sai em IBM MQ DEV.QUEUE.2</option>
            </select>
            <label>Mensagem</label>
            <input id="message" type="text" placeholder="mensagem de teste" />
            <button onclick="publish()">Publicar</button>
        </div>
        <div class="log" id="log"></div>
    </div>

    <script>
        const log = document.getElementById('log');

        function publish() {
            const target = document.getElementById('target').value;
            const message = document.getElementById('message').value;
            if (!message) return;
            fetch('/hub/publish', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ target, message })
            });
        }

        const source = new EventSource('/hub/events');
        source.onmessage = (e) => {
            const event = JSON.parse(e.data);
            const div = document.createElement('div');
            div.className = 'event ' + event.source;
            div.innerHTML = '<span class="ts">[' + event.timestamp + ']</span> <b>' + event.source + '</b> → ' + event.stage + ': ' + event.detail;
            log.prepend(div);
        };
    </script>
</body>
</html>
